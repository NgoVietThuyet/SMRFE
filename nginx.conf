# nginx cho SMR FrontEnd (server block, nạp vào conf.d). ${BACKEND_URL} được thay khi container khởi động.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tải tài liệu / mẫu biên bản lên (giới hạn chi tiết do Cấu hình hệ thống ở BE quyết định).
    client_max_body_size 210m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ----- API của BE
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sinh biên bản / tải file có thể lâu.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ----- Realtime (SignalR qua WebSocket)
    location /meetinghub {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- File tĩnh có mã băm trong tên → cache lâu
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|mp3)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- Trang Angular (định tuyến phía trình duyệt): luôn trả index.html, không cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
