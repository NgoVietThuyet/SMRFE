<div class="reset-page">
  <nz-card class="reset-card" [nzBordered]="false">
    <div class="reset-head">
      <img src="img/d2s_logo.png" alt="Smart Meeting" class="reset-logo" />
      <h2>ĐẶT LẠI MẬT KHẨU</h2>
      <p>Nhập mã đặt lại đã gửi tới email của bạn và mật khẩu mới.</p>
    </div>

    <label class="field-label" for="reset-token">Mã đặt lại</label>
    <nz-input-group nzPrefixIcon="safety" nzSize="large" class="mb-3">
      <input id="reset-token" nz-input [(ngModel)]="resetToken" placeholder="Dán mã đặt lại từ email" autocomplete="one-time-code" />
    </nz-input-group>

    <label class="field-label" for="reset-new">Mật khẩu mới</label>
    <nz-input-group nzPrefixIcon="lock" nzSize="large" class="mb-3" [nzSuffix]="toggle">
      <input id="reset-new" nz-input [type]="isPasswordVisible ? 'text' : 'password'" [(ngModel)]="newPassword"
        placeholder="Ít nhất 8 ký tự" autocomplete="new-password" />
    </nz-input-group>
    <ng-template #toggle>
      <nz-icon [nzType]="isPasswordVisible ? 'eye-invisible' : 'eye'" class="password-toggle" role="button"
        [attr.aria-label]="isPasswordVisible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        (click)="isPasswordVisible = !isPasswordVisible" />
    </ng-template>

    <label class="field-label" for="reset-confirm">Xác nhận mật khẩu mới</label>
    <nz-input-group nzPrefixIcon="lock" nzSize="large" class="mb-4">
      <input id="reset-confirm" nz-input [type]="isPasswordVisible ? 'text' : 'password'" [(ngModel)]="confirmPassword"
        placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" (keydown.enter)="submit()" />
    </nz-input-group>

    <button nz-button nzType="primary" nzBlock nzSize="large" [nzLoading]="isSubmitting" (click)="submit()">
      <nz-icon nzType="check" /> Đặt lại mật khẩu
    </button>
    <button nz-button nzType="link" nzBlock class="mt-2" (click)="backToLogin()">
      <nz-icon nzType="arrow-left" /> Quay lại đăng nhập
    </button>
  </nz-card>
</div>
