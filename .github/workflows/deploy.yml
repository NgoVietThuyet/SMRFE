name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Pull và build lại FE
        run: |
          set -e
          cd "$HOME/smr"
          git -C 3.FrontEnd pull --ff-only
          docker compose up -d --build smr-frontend

      - name: Chờ FE healthy
        run: |
          for i in $(seq 1 24); do
            s=$(docker inspect -f '{{.State.Health.Status}}' smr-frontend)
            if [ "$s" = "healthy" ]; then echo "FE healthy"; exit 0; fi
            sleep 5
          done
          docker logs --tail 60 smr-frontend
          exit 1

      - name: Dọn image cũ
        run: docker image prune -f
